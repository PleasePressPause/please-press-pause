name: Debug tournament questions

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Debug tournament questions (raw API)
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          poetry run python -c "
          import requests, json, os

          token = os.environ['METACULUS_TOKEN']
          headers = {'Authorization': f'Token {token}'}
          base = 'https://www.metaculus.com/api'

          print('=== Raw API: tournament 32916, statuses=open ===')
          resp = requests.get(f'{base}/posts/', params={
              'tournaments': 32916, 'statuses': 'open', 'limit': 100, 'with_cp': 'true'
          }, headers=headers)
          data = resp.json()
          print(f'Status: {resp.status_code}, count: {data.get(\"count\", \"N/A\")}, results: {len(data.get(\"results\", []))}')
          for post in data.get('results', []):
              pid = post.get('id')
              title = post.get('title', '?')[:80]
              has_notebook = 'notebook' in post
              has_question = 'question' in post and post['question'] is not None
              has_group = 'group_of_questions' in post and post['group_of_questions'] is not None
              qtype = post.get('question', {}).get('type', 'N/A') if has_question else 'N/A'
              nsub = len(post.get('group_of_questions', {}).get('questions', [])) if has_group else 0
              print(f'  Post {pid}: notebook={has_notebook}, question={has_question}(type={qtype}), group={has_group}(subs={nsub}), title={title}')
              if has_group:
                  for sq in post['group_of_questions']['questions']:
                      print(f'    Sub-question {sq.get(\"id\")}: type={sq.get(\"type\")}, status={sq.get(\"status\")}, title={sq.get(\"title\",\"?\")[:60]}')
          print()

          print('=== Raw API: tournament 32916, ALL statuses ===')
          resp2 = requests.get(f'{base}/posts/', params={
              'tournaments': 32916, 'limit': 100, 'with_cp': 'true'
          }, headers=headers)
          data2 = resp2.json()
          print(f'Status: {resp2.status_code}, count: {data2.get(\"count\", \"N/A\")}, results: {len(data2.get(\"results\", []))}')
          for post in data2.get('results', []):
              pid = post.get('id')
              title = post.get('title', '?')[:80]
              has_notebook = 'notebook' in post
              has_question = 'question' in post and post['question'] is not None
              has_group = 'group_of_questions' in post and post['group_of_questions'] is not None
              qtype = post.get('question', {}).get('type', 'N/A') if has_question else 'N/A'
              status = post.get('question', {}).get('status', 'N/A') if has_question else 'N/A'
              nsub = len(post.get('group_of_questions', {}).get('questions', [])) if has_group else 0
              print(f'  Post {pid}: notebook={has_notebook}, question={has_question}(type={qtype}, status={status}), group={has_group}(subs={nsub}), title={title}')
          print()

          print('=== Raw API: minibench, statuses=open ===')
          resp3 = requests.get(f'{base}/posts/', params={
              'tournaments': 'minibench', 'statuses': 'open', 'limit': 100, 'with_cp': 'true'
          }, headers=headers)
          data3 = resp3.json()
          print(f'Status: {resp3.status_code}, count: {data3.get(\"count\", \"N/A\")}, results: {len(data3.get(\"results\", []))}')
          for post in data3.get('results', []):
              pid = post.get('id')
              title = post.get('title', '?')[:80]
              print(f'  Post {pid}: title={title}')
          print()

          print('=== Library fetch ===')
          from forecasting_tools import MetaculusClient
          c = MetaculusClient()
          print(f'CURRENT_AI_COMPETITION_ID: {c.CURRENT_AI_COMPETITION_ID}')
          print(f'CURRENT_MINIBENCH_ID: {c.CURRENT_MINIBENCH_ID}')
          q1 = c.get_all_open_questions_from_tournament(c.CURRENT_AI_COMPETITION_ID)
          print(f'Library returned {len(q1)} questions for AI tournament')
          for q in q1:
              print(f'  [{type(q).__name__}] {q.page_url}')
          "
      - name: Check specific questions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          poetry run python -c "
          import requests, json, os

          token = os.environ['METACULUS_TOKEN']
          headers = {'Authorization': f'Token {token}'}

          # Check the NOAA temperature question (43062) - known spring tournament MC question
          for qid in [43062, 43053]:
              print(f'=== Raw API: post containing question {qid} ===')
              resp = requests.get(f'https://www.metaculus.com/api/posts/{qid}/', params={
                  'with_cp': 'true'
              }, headers=headers)
              if resp.status_code == 200:
                  post = resp.json()
                  pid = post.get('id')
                  title = post.get('title', '?')[:80]
                  projects = post.get('projects', {})
                  tournament_list = projects.get('tournament', [])
                  tournament_ids = [(p.get('id'), p.get('slug', '?'), p.get('name', '?')[:40]) for p in tournament_list]
                  print(f'  Post {pid}: title={title}')
                  print(f'  Tournaments: {tournament_ids}')
                  if 'question' in post and post['question']:
                      q = post['question']
                      print(f'  Question: type={q.get(\"type\")}, status={q.get(\"status\")}, id={q.get(\"id\")}')
                      print(f'  Open: {q.get(\"open_time\")}, Close: {q.get(\"scheduled_close_time\")}')
                  if 'group_of_questions' in post and post['group_of_questions']:
                      g = post['group_of_questions']
                      print(f'  Group with {len(g.get(\"questions\",[]))} sub-questions')
                      for sq in g['questions']:
                          print(f'    Sub {sq.get(\"id\")}: type={sq.get(\"type\")}, status={sq.get(\"status\")}')
              else:
                  print(f'  HTTP {resp.status_code}')
              print()

          print('=== Searching for NOAA question via tournament filter ===')
          resp = requests.get('https://www.metaculus.com/api/posts/', params={
              'search': 'NOAA temperature', 'limit': 5, 'with_cp': 'true'
          }, headers=headers)
          data = resp.json()
          print(f'Search results: {len(data.get(\"results\", []))}')
          for post in data.get('results', []):
              pid = post.get('id')
              title = post.get('title', '?')[:80]
              projects = post.get('projects', {})
              tournament_ids = [p.get('id') for p in projects.get('tournament', [])] if 'tournament' in projects else []
              print(f'  Post {pid}: title={title}')
              print(f'    Tournament IDs: {tournament_ids}')
              print(f'    Keys: {list(post.keys())[:15]}')
              if 'question' in post and post['question']:
                  q = post['question']
                  print(f'    Question type={q.get(\"type\")}, status={q.get(\"status\")}, id={q.get(\"id\")}')
              if 'group_of_questions' in post and post['group_of_questions']:
                  g = post['group_of_questions']
                  print(f'    Group with {len(g.get(\"questions\",[]))} sub-questions')
                  for sq in g['questions']:
                      print(f'      Sub {sq.get(\"id\")}: type={sq.get(\"type\")}, status={sq.get(\"status\")}')
          "
