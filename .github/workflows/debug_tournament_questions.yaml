name: Debug tournament questions

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Debug tournament questions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          poetry run python -c "
          from forecasting_tools import MetaculusClient, MultipleChoiceQuestion
          c = MetaculusClient()

          print('=== Tournament IDs ===')
          print(f'CURRENT_AI_COMPETITION_ID: {c.CURRENT_AI_COMPETITION_ID}')
          print(f'CURRENT_MINIBENCH_ID: {c.CURRENT_MINIBENCH_ID}')
          print()

          print('=== AI Competition ===')
          q1 = c.get_all_open_questions_from_tournament(c.CURRENT_AI_COMPETITION_ID)
          print(f'Total open questions: {len(q1)}')
          for q in q1:
              print(f'  [{type(q).__name__}] {q.page_url} - {q.question_text[:80]}')
          print()

          print('=== MiniBench ===')
          q2 = c.get_all_open_questions_from_tournament(c.CURRENT_MINIBENCH_ID)
          print(f'Total open questions: {len(q2)}')
          for q in q2:
              print(f'  [{type(q).__name__}] {q.page_url} - {q.question_text[:80]}')
          print()

          print('=== Checking specific question 43053 ===')
          try:
              q = c.get_question_by_url('https://www.metaculus.com/questions/43053/which-of-the-following-best-describes-the-status-of-djiboutis-april-10-2026-presidential-election/')
              print(f'Type: {type(q).__name__}')
              print(f'Question: {q.question_text}')
              print(f'State: {q.state}')
              print(f'Open time: {q.open_time}')
              print(f'Close time: {q.close_time}')
              print(f'Tournament slugs: {q.tournament_slugs}')
              print(f'Default project ID: {q.default_project_id}')
              # Dump projects from raw API JSON
              api = q.api_json
              if 'projects' in api:
                  print(f'API projects: {api[\"projects\"]}')
              # Show all top-level keys
              print(f'API JSON top-level keys: {list(api.keys())}')
          except Exception as e:
              import traceback
              traceback.print_exc()

          print()
          print('=== Raw API call for tournament 32916 ===')
          import requests, json
          resp = requests.get(
              'https://www.metaculus.com/api/posts/',
              params={'tournaments': 32916, 'statuses': 'open', 'limit': 10, 'with_cp': 'true'},
              headers={'Authorization': f'Token {c._auth_token}'},
              timeout=30,
          )
          print(f'Status code: {resp.status_code}')
          data = resp.json()
          print(f'Count: {data.get(\"count\", \"N/A\")}')
          print(f'Results count: {len(data.get(\"results\", []))}')
          for r in data.get('results', [])[:5]:
              print(f'  Post {r.get(\"id\")}: {r.get(\"title\", \"?\")[:80]}')
          if data.get('count', 0) == 0:
              # Try without status filter
              print()
              print('=== Raw API call for tournament 32916 (no status filter) ===')
              resp2 = requests.get(
                  'https://www.metaculus.com/api/posts/',
                  params={'tournaments': 32916, 'limit': 10, 'with_cp': 'true'},
                  headers={'Authorization': f'Token {c._auth_token}'},
                  timeout=30,
              )
              data2 = resp2.json()
              print(f'Count: {data2.get(\"count\", \"N/A\")}')
              for r in data2.get('results', [])[:5]:
                  print(f'  Post {r.get(\"id\")}: {r.get(\"title\", \"?\")[:80]} (status: {r.get(\"status\", \"?\")})')
          "
