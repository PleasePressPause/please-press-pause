name: Position Bias Experiment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'offline'
        type: choice
        options:
          - offline
          - real
      reps:
        description: 'Repetitions per ordering'
        required: false
        default: '5'
      model:
        description: 'LLM model name (ignored in offline mode)'
        required: false
        default: 'openrouter/openai/gpt-4o-mini'
      temperature:
        description: 'LLM temperature'
        required: false
        default: '0.1'
      question_url:
        description: 'Metaculus question URL (ignored in offline mode)'
        required: false
        default: 'https://www.metaculus.com/questions/34484/us-congress-control-after-2026-midterms/'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Restore cached experiment data
        uses: actions/cache/restore@v4
        with:
          path: experiment_data/
          key: experiment-data-${{ github.run_id }}
          restore-keys: |
            experiment-data-

      - name: Run position bias experiment
        run: |
          OFFLINE_FLAG=""
          if [ "${{ github.event.inputs.mode }}" = "offline" ]; then
            OFFLINE_FLAG="--offline"
          fi
          poetry run python experiment_position_bias.py \
            $OFFLINE_FLAG \
            --reps ${{ github.event.inputs.reps }} \
            --model "${{ github.event.inputs.model }}" \
            --temperature ${{ github.event.inputs.temperature }} \
            --question-url "${{ github.event.inputs.question_url }}"
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}

      - name: Save experiment data cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: experiment_data/
          key: experiment-data-${{ github.run_id }}

      - name: Upload experiment results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-results
          path: experiment_data/
          retention-days: 90
