name: Forecast on Metaculus Cup

on:
  workflow_dispatch:
    inputs:
      max_questions:
        description: 'Maximum number of questions to forecast (0 = no limit)'
        required: false
        default: '0'
        type: string
  schedule:
    - cron: "0 0 */2 * *" # runs at midnight every 2 days

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-questions:
    runs-on: ubuntu-latest
    outputs:
      has_questions: ${{ steps.check.outputs.has_questions }}
      question_count: ${{ steps.check.outputs.question_count }}
    steps:
      - name: Check for open Metaculus Cup questions
        id: check
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          SLUG="metaculus-cup-spring-2026"

          # Step 1: Try slug directly with API
          echo "=== Step 1: Try slug '$SLUG' directly ==="
          resolve_json=$(curl -s -H "Authorization: Token $METACULUS_TOKEN" \
            "https://www.metaculus.com/api/posts/?tournaments=$SLUG&limit=1&with_cp=true")
          echo "Response (first 500 chars): ${resolve_json:0:500}"
          count_with_slug=$(echo "$resolve_json" | jq '.count // 0')
          echo "Count with slug: $count_with_slug"

          if [ "$count_with_slug" -gt 0 ]; then
            echo "Slug works directly"
            count=$(curl -s -H "Authorization: Token $METACULUS_TOKEN" \
              "https://www.metaculus.com/api/posts/?tournaments=$SLUG&statuses=open&limit=1&with_cp=true" \
              | jq '.count // 0')
          else
            # Step 2: Try fetching a known tournament question and extracting the cup ID from its projects
            echo "=== Step 2: Try to find cup ID via known tournament question ==="
            # Fetch a question from the main AI tournament and check if it's also in a cup
            sample_json=$(curl -s -H "Authorization: Token $METACULUS_TOKEN" \
              "https://www.metaculus.com/api/posts/?tournaments=32916&limit=1&with_cp=true")
            echo "Sample question projects:"
            echo "$sample_json" | jq '.results[0].projects // empty'

            # Step 3: Try common tournament ID patterns near known IDs
            echo "=== Step 3: Brute-force check nearby tournament IDs ==="
            for candidate_id in 32917 32918 32919 32920 32921 32922 32923 32924 32925; do
              candidate_count=$(curl -s -H "Authorization: Token $METACULUS_TOKEN" \
                "https://www.metaculus.com/api/posts/?tournaments=$candidate_id&limit=1&with_cp=true" \
                | jq '.count // 0')
              if [ "$candidate_count" -gt 0 ]; then
                # Get tournament name from first result's projects
                name=$(curl -s -H "Authorization: Token $METACULUS_TOKEN" \
                  "https://www.metaculus.com/api/posts/?tournaments=$candidate_id&limit=1&with_cp=true" \
                  | jq -r '.results[0].projects.tournament[]? | select(.id == '$candidate_id') | .name // empty')
                echo "ID $candidate_id: $candidate_count questions (name: $name)"
              fi
            done

            echo "=== Step 4: Check IDs in the 329xx range ==="
            for candidate_id in $(seq 32826 32835); do
              candidate_count=$(curl -s -H "Authorization: Token $METACULUS_TOKEN" \
                "https://www.metaculus.com/api/posts/?tournaments=$candidate_id&limit=1&with_cp=true" \
                | jq '.count // 0')
              if [ "$candidate_count" -gt 0 ]; then
                name=$(curl -s -H "Authorization: Token $METACULUS_TOKEN" \
                  "https://www.metaculus.com/api/posts/?tournaments=$candidate_id&limit=1&with_cp=true" \
                  | jq -r '.results[0].projects.tournament[]? | select(.id == '$candidate_id') | .name // empty')
                echo "ID $candidate_id: $candidate_count questions (name: $name)"
              fi
            done

            count=0
          fi

          echo "Metaculus Cup: $count open question(s)"
          echo "question_count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "has_questions=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_questions=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cancel run if no open questions
        if: steps.check.outputs.has_questions == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "No open questions found — cancelling workflow run"
          gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  forecast:
    needs: check-questions
    if: needs.check-questions.outputs.has_questions == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          poetry run python main.py --mode metaculus_cup --real --publish --max-questions ${{ github.event.inputs.max_questions || '0' }}
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: Upload forecast reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-reports-cup-${{ github.run_id }}
          path: reports/
          retention-days: 90
