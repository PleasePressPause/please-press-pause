name: Forecast on Metaculus Cup

on:
  workflow_dispatch:
    inputs:
      max_questions:
        description: 'Maximum number of questions to forecast (0 = no limit)'
        required: false
        default: '0'
        type: string
  schedule:
    - cron: "0 0 */2 * *" # runs at midnight every 2 days

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-questions:
    runs-on: ubuntu-latest
    outputs:
      has_questions: ${{ steps.check.outputs.has_questions }}
      question_count: ${{ steps.check.outputs.question_count }}
    steps:
      - name: Debug Metaculus Cup tournament ID
        id: check
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          SLUG="metaculus-cup-spring-2026"
          AUTH="Authorization: Token $METACULUS_TOKEN"

          echo "=== Try 1: ?tournaments=$SLUG (any status) ==="
          resp=$(curl -s -H "$AUTH" \
            "https://www.metaculus.com/api/posts/?tournaments=$SLUG&limit=1&with_cp=true")
          echo "HTTP response (first 500 chars): ${resp:0:500}"
          echo "Count: $(echo "$resp" | jq '.count // "N/A"')"

          echo ""
          echo "=== Try 2: ?project=$SLUG ==="
          resp=$(curl -s -H "$AUTH" \
            "https://www.metaculus.com/api/posts/?project=$SLUG&limit=1&with_cp=true")
          echo "Count: $(echo "$resp" | jq '.count // "N/A"')"

          echo ""
          echo "=== Try 3: /api/projects/ listing (search for 'cup') ==="
          resp=$(curl -s -H "$AUTH" \
            "https://www.metaculus.com/api/projects/?search=cup+spring+2026&limit=5")
          echo "Response (first 1000 chars): ${resp:0:1000}"

          echo ""
          echo "=== Try 4: /api/tournaments/ endpoint ==="
          resp=$(curl -s -H "$AUTH" \
            "https://www.metaculus.com/api/tournaments/?search=cup&limit=5")
          echo "Response (first 1000 chars): ${resp:0:1000}"

          echo ""
          echo "=== Try 5: /api/projects/$SLUG/ ==="
          resp=$(curl -s -H "$AUTH" \
            "https://www.metaculus.com/api/projects/$SLUG/")
          echo "Response (first 500 chars): ${resp:0:500}"

          echo ""
          echo "=== Try 6: Tournament page HTML for embedded data ==="
          resp=$(curl -s "https://www.metaculus.com/tournament/$SLUG/")
          # Look for JSON data containing tournament ID
          echo "Page length: ${#resp} chars"
          echo "Grep for 'metaculus-cup': $(echo "$resp" | grep -o '"slug":"metaculus-cup[^"]*"' | head -3)"
          echo "Grep for tournament id: $(echo "$resp" | grep -oP '"id":\d+' | head -5)"

          # Set outputs — this is a debug run, always say no questions
          echo "has_questions=false" >> "$GITHUB_OUTPUT"
          echo "question_count=0" >> "$GITHUB_OUTPUT"
      - name: Cancel run if no open questions
        if: steps.check.outputs.has_questions == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "No open questions found — cancelling workflow run"
          gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  forecast:
    needs: check-questions
    if: needs.check-questions.outputs.has_questions == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          poetry run python main.py --mode metaculus_cup --real --publish --max-questions ${{ github.event.inputs.max_questions || '0' }}
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: Upload forecast reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-reports-cup-${{ github.run_id }}
          path: reports/
          retention-days: 90
