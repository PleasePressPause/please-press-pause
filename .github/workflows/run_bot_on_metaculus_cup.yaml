name: Forecast on Metaculus Cup

on:
  workflow_dispatch:
    inputs:
      max_questions:
        description: 'Maximum number of questions to forecast (0 = no limit)'
        required: false
        default: '0'
        type: string
  schedule:
    - cron: "0 0 */2 * *" # runs at midnight every 2 days

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-questions:
    runs-on: ubuntu-latest
    outputs:
      has_questions: ${{ steps.check.outputs.has_questions }}
      question_count: ${{ steps.check.outputs.question_count }}
    steps:
      - name: Check for open Metaculus Cup questions
        id: check
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          SLUG="metaculus-cup-spring-2026"

          resp=$(curl -s -H "Authorization: Token $METACULUS_TOKEN" \
            "https://www.metaculus.com/api/posts/?tournaments=$SLUG&statuses=open&limit=100&with_cp=true")
          # Count only actual questions (exclude notebook/announcement posts)
          count=$(echo "$resp" | jq '[.results // [] | .[] | select(has("notebook") | not)] | length')
          echo "Metaculus Cup ($SLUG): $count forecastable question(s)"
          echo "question_count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "has_questions=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_questions=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cancel run if no open questions
        if: steps.check.outputs.has_questions == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "No open questions found — cancelling workflow run"
          gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  forecast:
    needs: check-questions
    if: needs.check-questions.outputs.has_questions == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          poetry run python main.py --mode metaculus_cup --real --publish --max-questions ${{ github.event.inputs.max_questions || '0' }}
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
      - name: Upload forecast reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-reports-cup-${{ github.run_id }}
          path: reports/
          retention-days: 90
